[package]
name = "naval-sky"
description = "The game's sky on wgpu: atmosphere LUTs, dome, sun, moon and stars, and the environment lighting ships and the sea read"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A portable crate: `bun run check` checks it for wasm32-unknown-unknown (native/AGENTS.md).
# One test program for every file in tests/ (tests/all.rs).
autotests = false
[package.metadata.native]
portable = true

[dependencies]
native-unify.workspace = true
# The cloud genera of the scene's clouds (`CloudGenus`, `HighClouds`): the simulation's, without the simulation.
naval-sky-types.workspace = true
wgpu = { workspace = true, features = ["naga-ir"] }
glam.workspace = true
bytemuck.workspace = true
# The sky as a renderer-core layer (`naval_sky::layer::SkyLayer`).
naval-render.workspace = true

[dev-dependencies]
# The theatre's sun and sidereal time (the round Earth's, which the simulation re-exports), which the stars' place is
# checked against (`tests/place.rs`, `state.rs`'s tests) and the stills stand their stars by (`examples/stills.rs`).
naval-earth.workspace = true
native-offscreen.workspace = true
pollster.workspace = true
image.workspace = true
anyhow.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
