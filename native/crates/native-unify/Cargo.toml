# Generated by `bun run native:features --write` (scripts/build/native-features.ts); do not edit by hand.
# Filtered by tools/export-from-game.sh: only the entries for packages in the exported crates' dependency graph
# (`cargo tree` in the game's workspace with native-unify pruned); the game's other dependencies are left out.
# Every native crate depends on this one, so every build (one crate's tests, the capture client, the packaged client)
# asks for the same features of the dependencies below and compiles them, and everything above them, once: Cargo would
# otherwise unify features per command. Entries are per platform, so wasm32 checks see none of them.
[package]
name = "native-unify"
description = "No code: the union of the native builds' features for the dependencies they share"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
arrayvec = { version = "0.7.8", default-features = false, features = ["std"] }
bitflags = { version = "2.13.2", default-features = false, features = ["std"] }
block2 = { version = "0.6.2", default-features = false, features = ["alloc", "default", "std"] }
bytemuck = { version = "1.25.2", default-features = false, features = ["aarch64_simd", "bytemuck_derive", "derive", "extern_crate_alloc", "min_const_generics", "wasm_simd"] }
codespan-reporting = { version = "0.13.1", default-features = false, features = ["std", "termcolor"] }
core-foundation-sys = { version = "0.8.7", default-features = false, features = ["default", "link"] }
glam = { version = "0.33.11", default-features = false, features = ["all-types", "bytemuck", "default", "f64", "float-types", "i16", "i32", "i64", "i8", "integer-types", "isize", "mint", "mint-05", "serde", "size-types", "std", "u16", "u32", "u64", "u8", "usize"] }
gltf = { version = "1.4.1", default-features = false, features = ["base64", "default", "extras", "image", "import", "names", "urlencoding", "utils"] }
gltf-json = { version = "1.4.1", default-features = false, features = ["default", "extras", "names"] }
half = { version = "2.7.1", default-features = false, features = ["alloc", "default", "num-traits", "std"] }
hashbrown = { version = "0.17.1", default-features = false, features = ["default-hasher", "inline-more"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
indexmap = { version = "2.14.2", default-features = false, features = ["default", "std"] }
