[package]
name = "naval-region-bake"
description = "The land release bake: the world's 1-degree squares from Terrarium or Copernicus GLO-30, finished into a release's final squares"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A portable crate: no network, no files, no threads (`bun run check` checks it for wasm32-unknown-unknown,
# native/AGENTS.md). Its host, `naval-land-bake`, fetches, caches and runs it on its threads.
# One test program for every file in tests/ (tests/all.rs).
autotests = false
[package.metadata.native]
portable = true

[dependencies]
native-unify.workspace = true
# NSQ1 squares and GLO-30's DEFLATE blocks are zlib streams.
flate2.workspace = true
sha2.workspace = true
# Terrarium tiles are 8-bit RGB PNGs.
png.workspace = true
serde.workspace = true
serde_json.workspace = true
# The final layer's lattice, blocks and file (shared with the simulation and the store), and the square key.
naval-land-format.workspace = true

[dev-dependencies]
flate2.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
