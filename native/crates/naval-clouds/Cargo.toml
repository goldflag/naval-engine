[package]
name = "naval-clouds"
description = "The game's clouds and weather on wgpu: takram's volumetric clouds (Beer shadow maps, temporal upscaling, light shafts, haze), cloud shadows, rain and lightning"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# A portable crate: `bun run check` checks it for wasm32-unknown-unknown (native/AGENTS.md).
# One test program for every file in tests/ (tests/all.rs).
autotests = false
[package.metadata.native]
portable = true

[dependencies]
native-unify.workspace = true
# The layers, the weathers' profiles, the weather texture and the anchors' blend the simulation reads too, without the
# simulation: a simulated field is laid on its anchors by the game's placement (`naval-clouds-sim`).
naval-cloud-field.workspace = true
wgpu = { workspace = true, features = ["naga-ir"] }
glam.workspace = true
bytemuck.workspace = true
# The embedded cloud textures are PNGs.
image.workspace = true
naval-sky.workspace = true
naval-render.workspace = true

[dev-dependencies]
native-offscreen.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
